name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AI-Unmarker-Pro-Windows-x64.zip
          - os: macos-latest
            artifact_name: AI-Unmarker-Pro-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2 Pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # Windows 빌드 및 패키징
      - name: Build for Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --noconsole --onefile --icon=icons/icon.ico --name "AI-Unmarker-Pro" --collect-all customtkinter --collect-all tkinterdnd2 main.py
          mkdir release_pkg
          copy dist\AI-Unmarker-Pro.exe release_pkg\
          xcopy /E /I fonts release_pkg\fonts
          xcopy /E /I icons release_pkg\icons
          if exist remove-ai-watermarks xcopy /E /I remove-ai-watermarks release_pkg\remove-ai-watermarks
          if exist noai-watermark xcopy /E /I noai-watermark release_pkg\noai-watermark
          Compress-Archive -Path release_pkg\* -DestinationPath AI-Unmarker-Pro-Windows-x64.zip

      # macOS 빌드 및 패키징
      - name: Build for macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --noconsole --windowed --icon=icons/icon.png --name "AI Unmarker Pro" --collect-all customtkinter --collect-all tkinterdnd2 main.py
          mkdir release_pkg
          cp -R "dist/AI Unmarker Pro.app" release_pkg/
          cp -R fonts release_pkg/
          cp -R icons release_pkg/
          [ -d "remove-ai-watermarks" ] && cp -R remove-ai-watermarks release_pkg/
          [ -d "noai-watermark" ] && cp -R noai-watermark release_pkg/
          cd release_pkg
          zip -r -y ../AI-Unmarker-Pro-macOS.zip .
          cd ..

      # GitHub Releases 업로드
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
