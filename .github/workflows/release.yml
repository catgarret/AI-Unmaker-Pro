name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and build using the project builder
        run: |
          python assemble_main.py
          python build.py
      - name: Archive macOS application with permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/AI Unmarker Pro.app" AI-Unmarker-Pro-macOS.zip
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath AI-Unmarker-Pro-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Unmarker-Pro-${{ matrix.os }}
          path: AI-Unmarker-Pro-*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --generate-notes
